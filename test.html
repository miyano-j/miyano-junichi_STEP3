<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TNG CAFE</title>
    <link rel="stylesheet" href="test.css">
</head>
<body>

    <header>
        <h1>TNG CAFE</h1>
        <p>心安らぐ一杯をあなたに</p>

        <nav>
            <ul>
                <li><a href="#about">About Us</a></li>
                <li><a href="#menu">Menu</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>
        
     <main>
        <section id="about">                
            <h2>About Us</h2>
            <p>
                TNGCafeは自然の香りに包まれたリラックス空間を提供しています。<br>
                自家焙煎コーヒーと手作りスイーツで、穏やかな時間をお過ごしください。
            </p>
            <img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085"
             alt="カフェの写真" width="300">
         </section>

        <section id="menu">
            <h2>Menu</h2>
            <div class="menu-list">
            <div class="menu-item">
                <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93"
                 alt="コーヒー" width="200">
                <p>ブレンドコーヒー</p>
            </div>

            <div class="menu-item">
                <img src="https://images.unsplash.com/photo-1563729784474-d77dbb933a9e"
                 alt="ケーキ" width="200">
                <p>ベイクドチーズケーキ</p>
            </div>

            <div class="menu-item">
                <img src="https://images.unsplash.com/photo-1517701604599-bb29b565090c"
                 alt="ラテ" width="200">
                <p>カフェラテ</p>
            </div>
            </div></section>

        <section id="contact">
            <h2>Contact</h2>
            <form>
                <label>お名前：<br>
                    <input type="text">
                </label>

                <label>メールアドレス：<br>
                    <input type="email">
                </label>

                <label>お問い合わせ内容：<br>
                    <textarea></textarea>
                </label>

                <button type="submit">送信</button>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2025 TNG Cafe</p>
    </footer>
</body>
</html>
